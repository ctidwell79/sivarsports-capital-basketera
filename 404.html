<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Capital Basketera 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(135deg, #1E2D58 0%, #2a3f7a 100%);
    color: white;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 2rem;
  }
  .code { font-family: 'Bebas Neue', sans-serif; font-size: 8rem; color: #F5C518; line-height: 1; margin: 0; letter-spacing: 0.05em; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 0.05em; margin: 0.5rem 0; }
  p { opacity: 0.85; margin: 0.5rem 0 2rem; max-width: 400px; }
  .btn {
    display: inline-block; padding: 0.75rem 1.5rem;
    background: #E8607A; color: white;
    text-decoration: none; border-radius: 6px;
    font-weight: 600; font-size: 0.9rem;
    transition: transform 0.15s;
  }
  .btn:hover { transform: translateY(-2px); }
  .ctc { margin-top: 3rem; font-family: 'Bebas Neue', sans-serif; color: #E8607A; letter-spacing: 0.12em; font-size: 0.85rem; opacity: 0.7; }
</style>
</head>
<body>
  <p class="code">404</p>
  <h1>Página no encontrada</h1>
  <p>Esa ruta no existe en el calendario. Regresá al programa principal.</p>
  <a href="/" class="btn">← Volver al calendario</a>
  <div class="ctc">CTC · CAMPEONES TRABAJAN COMO CAMPEONES</div>
</body>
</html>
